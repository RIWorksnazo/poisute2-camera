<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POISUTE 2 - TRASH CAM MONITOR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #fff; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; box-sizing: border-box; padding: 20px; z-index: 10; }
        
        /* ▼ LIVEの文字と、ゆったりした点滅アニメーション（2s） */
        .cam-title { position: absolute; top: 20px; left: 30px; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        .live-icon { color: red; animation: slowBlink 2s infinite ease-in-out; }
        @keyframes slowBlink { 
            0% { opacity: 1; } 
            50% { opacity: 0.2; } 
            100% { opacity: 1; } 
        }
        
        /* 右下のエラー確認用ログ（最小限残しています） */
        #footer-info { position: absolute; bottom: 20px; right: 30px; font-size: 16px; text-align: right; line-height: 1.5; text-shadow: 1px 1px 3px #000; opacity: 0.5; }
        .debug-text { font-size: 12px; color: #00e676; margin-top: 5px; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <!-- ▼ テキストをLIVEのみに変更 -->
        <div class="cam-title"><span class="live-icon">● LIVE</span></div>
        
        <!-- 通信モニターは完全に削除しました -->
        
        <div id="footer-info">
            <div id="status">SYS: STANDBY</div>
            <div id="monitor-log" class="debug-text">T: DROP TEST</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111); // 箱の外の暗闇
        
        // カメラ設定：箱の手前から奥を見下ろすアングル
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 15, 35); 
        camera.lookAt(0, -5, 0);       

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // ▼ 【追加】奥行きのある「大きな入れ物（箱）」を作ります
        const boxGeometry = new THREE.BoxGeometry(60, 40, 60);
        const boxMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xcccccc,       // 箱の壁・床の色（明るめのグレー）
            side: THREE.BackSide,  // 箱の「内側」を描画する
            roughness: 0.9 
        });
        const bigBox = new THREE.Mesh(boxGeometry, boxMaterial);
        bigBox.position.set(0, 10, 0); // 箱の中心。床は -10 の高さになります
        bigBox.receiveShadow = true;   // 箱の床や壁に影を落とす
        scene.add(bigBox);

        // 照明設定：箱の中に綺麗な影が落ちるように調整
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); 
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0); 
        directionalLight.position.set(0, 25, 20); // 手前の上から照らす
        directionalLight.castShadow = true; 
        // 影のクオリティを少し上げます
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.left = -30;
        directionalLight.shadow.camera.right = 30;
        directionalLight.shadow.camera.top = 30;
        directionalLight.shadow.camera.bottom = -30;
        scene.add(directionalLight);

        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');

        const fallingItems = [];
        const panelGeometry = new THREE.PlaneGeometry(4.5, 4.5); 

        window.dropItem = function(imageName) {
            try {
                let randomX, randomZ, landY;
                let attempts = 0, isOverlapping = true;
                
                while (isOverlapping && attempts < 500) {
                    // 箱の広さ（横幅と奥行き）に合わせてランダムに散らす
                    randomX = (Math.random() - 0.5) * 40; 
                    randomZ = (Math.random() * -30) + 10; 
                    
                    // 床の高さは y = -10。画像が半分床にめり込まないよう、少し浮かせた -7.5 を着地地点に。
                    landY = -7.5; 
                    
                    isOverlapping = false;
                    for (const item of fallingItems) {
                        const dx = item.landX - randomX;
                        const dz = item.landZ - randomZ;
                        if (Math.sqrt(dx * dx + dz * dz) < 4.5) { 
                            isOverlapping = true; break; 
                        } 
                    }
                    attempts++;
                }

                let material;

                if (imageName && String(imageName).trim() !== "") {
                    let url = String(imageName).trim();
                    if (!url.startsWith('http')) {
                        url = 'https://riworksnazo.github.io/poisute2-camera/' + url;
                    }
                    const texture = textureLoader.load(url);
                    texture.colorSpace = THREE.SRGBColorSpace;
                    
                    material = new THREE.MeshStandardMaterial({ 
                        map: texture, 
                        color: 0xffffff, 
                        roughness: 0.8, 
                        transparent: true,
                        side: THREE.DoubleSide
                    });
                } else {
                    material = new THREE.MeshStandardMaterial({ 
                        color: 0xffffff, 
                        roughness: 0.8,
                        side: THREE.DoubleSide
                    }); 
                }
                
                const item = new THREE.Mesh(panelGeometry, material);
                item.position.set(randomX, 30, randomZ); // 天井付近から落下スタート
                item.quaternion.copy(camera.quaternion); // 常にカメラを向く
                item.castShadow = true; 
                scene.add(item);

                fallingItems.push({ mesh: item, velocity: 0, landX: randomX, landY: landY, landZ: randomZ });
            } catch (err) {
                console.error("落下エラー:", err);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') location.reload(); 
            if (e.key === 't' || e.key === 'T') window.dropItem(""); 
        });

        function animate() {
            requestAnimationFrame(animate);
            fallingItems.forEach(item => {
                if (item.mesh.position.y > item.landY) {
                    item.velocity += 0.025; // 落下速度
                    item.mesh.position.y -= item.velocity;
                } else {
                    item.mesh.position.y = item.landY; 
                }
            });
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 通信処理
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwL6vY1pA1vqbrq4bCLIVLdWGtKoXztcbxsi812AkzILF3eo54oJnh-fw2MCFttjUoh/exec";
        let isFetching = false;
        let knownMissions = {}; 
        let isFirstLoad = true;

        async function fetchData() {
            if (isFetching) return; 
            isFetching = true;
            try {
                const response = await fetch(GAS_URL + "?t=" + Date.now(), { cache: 'no-store' });
                const data = await response.json();
                updateUIAndCheckDrops(data);
                document.getElementById('status').innerText = "SYS: ONLINE";
                document.getElementById('status').style.color = "#888";
            } catch (error) {
                document.getElementById('status').innerText = "SYS: ERROR";
                document.getElementById('status').style.color = "#ff5252";
            } finally {
                isFetching = false; 
                setTimeout(fetchData, 1000); 
            }
        }

        function updateUIAndCheckDrops(data) {
            let logText = "";

            data.missions.forEach((m, index) => {
                try {
                    const name = String(m.name || m.hintImage || `mission_${index}`);
                    const isCleared = (m.cleared === true || String(m.cleared).toUpperCase() === "TRUE");

                    if (isCleared && !knownMissions[name]) {
                        if (!isFirstLoad) {
                            window.dropItem(m.hintImage || ""); 
                            logText = "DROP: " + String(m.name || "ITEM").substring(0,6);
                        }
                    }
                    knownMissions[name] = isCleared;
                } catch (err) {
                    // エラーは無視して次に進む
                }
            });
            
            if (logText) {
                const logEl = document.getElementById('monitor-log');
                logEl.innerText = logText;
                // 新しいものが落ちたら文字を少し光らせる演出
                logEl.style.color = "#fff";
                setTimeout(() => { logEl.style.color = "#00e676"; }, 500);
            }
            
            isFirstLoad = false;
        }

        fetchData();
    </script>
</body>
</html>
