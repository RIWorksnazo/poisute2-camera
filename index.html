<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POISUTE 2 - TRASH CAM MONITOR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #fff; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; box-sizing: border-box; padding: 20px; z-index: 10; }
        .cam-title { position: absolute; top: 20px; left: 30px; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        .rec-icon { color: red; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        #footer-info { position: absolute; bottom: 20px; right: 30px; font-size: 16px; color: #888; text-align: right; line-height: 1.5; }
        .drop-status { font-weight: bold; color: #ffeb3b; }
        .drop-status.off { color: #f44336; }
        /* ▼ 追加：画像が読み込めているか画面で確認するための特大文字 */
        .debug-text { font-size: 18px; color: #00ff00; margin-top: 10px; font-weight: bold; background: rgba(0,0,0,0.7); padding: 5px;}
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <div class="cam-title"><span class="rec-icon">● REC</span> CAM-01 : MAIN TRASH AREA</div>
        
        <div id="footer-info">
            <div id="status">SYS: STANDBY...</div>
            <div id="drop-indicator" class="drop-status">DROP: CHECKING...</div>
            <!-- ここに画像読み込みの結果が出ます -->
            <div id="debug-text" class="debug-text">画像レーダー：待機中...</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505); 
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 14, 22); 
        camera.lookAt(0, -2, 0);       

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0); 
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 3.0); 
        directionalLight.position.set(5, 15, 10);
        directionalLight.castShadow = true; 
        scene.add(directionalLight);

        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');

        const fallingItems = [];
        const boxGeometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);

        window.dropItem = function(imageName) {
            let randomX, randomZ, landY;
            let attempts = 0, isOverlapping = true;

            while (isOverlapping && attempts < 500) {
                randomX = (Math.random() - 0.5) * 20; randomZ = (Math.random() * -12) + 6; landY = -0.5; 
                isOverlapping = false;
                for (const item of fallingItems) {
                    const dx = item.landX - randomX; const dz = item.landZ - randomZ;
                    if (Math.sqrt(dx * dx + dz * dz) < 2.0) { isOverlapping = true; break; }
                }
                attempts++;
            }

            // まず真っ白の箱の素材を作る
            const material = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7, metalness: 0.1 });
            const debugText = document.getElementById('debug-text');

            if (imageName && imageName.trim() !== "") {
                let url = imageName.trim();
                
                // 【超重要】もし http から始まっていなければ、強制的にGitHubのフルアドレスをくっつける！
                if (!url.startsWith('http')) {
                    url = 'https://riworksnazo.github.io/poisute2-camera/' + url;
                }

                debugText.innerText = "⏳ 読込中: " + url;
                debugText.style.color = "#ffff00"; // 黄色

                // 画像を読み込んで、後から箱に貼り付ける処理
                textureLoader.load(
                    url,
                    function(texture) {
                        texture.colorSpace = THREE.SRGBColorSpace;
                        material.map = texture;
                        material.needsUpdate = true; // 貼り付け更新！
                        debugText.innerText = "✅ 成功!: 画像が貼られました";
                        debugText.style.color = "#00ff00"; // 緑色
                    },
                    undefined,
                    function(err) {
                        debugText.innerText = "❌ 失敗!: 画像が見つかりません (" + url + ")";
                        debugText.style.color = "#ff5252"; // 赤色
                    }
                );
            } else {
                debugText.innerText = "⚠️ 画像の指定なし（白箱）";
                debugText.style.color = "#aaaaaa";
            }
            
            const item = new THREE.Mesh(boxGeometry, material);
            item.position.set(randomX, 12, randomZ); 
            item.rotation.set(Math.random() * 0.5, Math.random() * Math.PI, 0);
            item.castShadow = true; 
            scene.add(item);

            fallingItems.push({ 
                mesh: item, velocity: 0, bounces: 0, landY: landY, landX: randomX, landZ: randomZ,
                rotSpeedX: (Math.random() - 0.5) * 0.1, rotSpeedY: (Math.random() - 0.5) * 0.2, rotSpeedZ: (Math.random() - 0.5) * 0.1
            });
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') location.reload(); 
            if (e.key === 't' || e.key === 'T') window.dropItem(""); 
        });

        function animate() {
            requestAnimationFrame(animate);
            fallingItems.forEach(item => {
                if (item.mesh.position.y > item.landY) {
                    item.velocity += 0.008; item.mesh.position.y -= item.velocity;
                    item.mesh.rotation.x += item.rotSpeedX; item.mesh.rotation.y += item.rotSpeedY; item.mesh.rotation.z += item.rotSpeedZ;
                } else if (item.bounces < 2) {
                    item.mesh.position.y = item.landY; item.velocity = -item.velocity * 0.3; item.bounces++;
                    item.rotSpeedX *= 0.5; item.rotSpeedY *= 0.5;
                } else {
                    item.mesh.position.y = item.landY;
                }
            });
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ▼▼▼ 必ず最新のGAS URLに書き換えてください！ ▼▼▼
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwL6vY1pA1vqbrq4bCLIVLdWGtKoXztcbxsi812AkzILF3eo54oJnh-fw2MCFttjUoh/exec";
        
        let isFetching = false;
        let droppedMissions = new Set();
        let isFirstLoad = true;

        async function fetchData() {
            if (isFetching) return; 
            isFetching = true;
            try {
                const response = await fetch(GAS_URL + "?t=" + Date.now(), { cache: 'no-store' });
                const data = await response.json();
                updateUIAndCheckDrops(data);
                document.getElementById('status').innerText = "SYS: ONLINE 🟢";
            } catch (error) {
                document.getElementById('status').innerText = "SYS: ERROR 🔴";
            } finally {
                setTimeout(fetchData, 1000); 
            }
        }

        function updateUIAndCheckDrops(data) {
            data.missions.forEach((m, index) => {
                const uniqueKey = m.name || `mission_${index}`;
                
                if (m.cleared && m.dropItem && data.isDropEnabled) {
                    if (!isFirstLoad && !droppedMissions.has(uniqueKey)) {
                        window.dropItem(m.hintImage || ""); 
                        droppedMissions.add(uniqueKey); 
                    } else if (isFirstLoad) {
                        droppedMissions.add(uniqueKey); 
                    }
                } else if (!m.cleared) {
                    droppedMissions.delete(uniqueKey);
                }
            });
            isFirstLoad = false;
        }

        fetchData();
    </script>
</body>
</html>
