<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POISUTE 2 - TRASH CAM MONITOR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #fff; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; box-sizing: border-box; padding: 20px; z-index: 10; }
        .cam-title { position: absolute; top: 20px; left: 30px; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        .rec-icon { color: red; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        #footer-info { position: absolute; bottom: 20px; right: 30px; font-size: 16px; color: #888; text-align: right; line-height: 1.5; }
        .drop-status { font-weight: bold; color: #ffeb3b; }
        .drop-status.off { color: #f44336; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <div class="cam-title"><span class="rec-icon">● REC</span> CAM-01 : MAIN TRASH AREA</div>
        
        <div id="footer-info">
            <div id="status">SYS: STANDBY...</div>
            <div id="drop-indicator" class="drop-status">DROP: CHECKING...</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505); 
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 14, 22); 
        camera.lookAt(0, -2, 0);       

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0); 
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 3.0); 
        directionalLight.position.set(5, 15, 10);
        directionalLight.castShadow = true; 
        scene.add(directionalLight);

        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');

        const fallingItems = [];
        const imageGeometry = new THREE.PlaneGeometry(4.0, 4.0); // 画像を少し大きめに

        window.dropItem = function(imageName) {
            let randomX, randomZ, landY;
            let attempts = 0, isOverlapping = true;

            // 落とす場所を決定
            while (isOverlapping && attempts < 500) {
                randomX = (Math.random() - 0.5) * 20; 
                randomZ = (Math.random() * -12) + 6;  
                landY = (Math.random() * 2) - 1.0; // 着地位置の高さに少しバラつきを持たせる
                isOverlapping = false;
                for (const item of fallingItems) {
                    const dx = item.landX - randomX;
                    const dz = item.landZ - randomZ;
                    if (Math.sqrt(dx * dx + dz * dz) < 2.5) { isOverlapping = true; break; } 
                }
                attempts++;
            }

            let material;
            if (imageName && imageName.trim() !== "") {
                let url = imageName.trim();
                if (!url.startsWith('http')) {
                    url = 'https://riworksnazo.github.io/poisute2-camera/' + url;
                }
                const texture = textureLoader.load(url);
                texture.colorSpace = THREE.SRGBColorSpace;
                
                material = new THREE.MeshStandardMaterial({ 
                    map: texture, color: 0xffffff, roughness: 0.8, metalness: 0.1,
                    side: THREE.DoubleSide, transparent: true
                });
            } else {
                material = new THREE.MeshStandardMaterial({ 
                    color: 0xffffff, roughness: 0.8, metalness: 0.1, side: THREE.DoubleSide 
                });
            }
            
            const item = new THREE.Mesh(imageGeometry, material);
            // 最初から高い位置にセット
            item.position.set(randomX, 15, randomZ); 
            
            // ▼ 変更：常にカメラの方向（正面）を向かせる！
            item.lookAt(camera.position);
            
            item.castShadow = true; 
            scene.add(item);

            fallingItems.push({ 
                mesh: item, 
                velocity: 0, 
                landY: landY, 
                landX: randomX, 
                landZ: randomZ
            });
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') location.reload(); 
            if (e.key === 't' || e.key === 'T') window.dropItem(""); 
        });

        function animate() {
            requestAnimationFrame(animate);
            fallingItems.forEach(item => {
                if (item.mesh.position.y > item.landY) {
                    // ▼ 変更：回転せず、スーッと加速しながら落ちる
                    item.velocity += 0.015; // スピード調整
                    item.mesh.position.y -= item.velocity;
                } else {
                    // ▼ 変更：バウンドさせずに着地位置でピタッと止まる
                    item.mesh.position.y = item.landY;
                }
            });
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ▼▼▼ 必ずご自身のGAS URLに書き換えてください！ ▼▼▼
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwL6vY1pA1vqbrq4bCLIVLdWGtKoXztcbxsi812AkzILF3eo54oJnh-fw2MCFttjUoh/exec";
        
        let isFetching = false;
        let droppedMissions = new Set();
        let isFirstLoad = true; // 最初の読み込みかどうかを判定するフラグ

        async function fetchData() {
            if (isFetching) return; 
            isFetching = true;
            try {
                const response = await fetch(GAS_URL + "?t=" + Date.now(), { cache: 'no-store' });
                const data = await response.json();
                updateUIAndCheckDrops(data);
                document.getElementById('status').innerText = "SYS: ONLINE 🟢";
                
                const dropIndicator = document.getElementById('drop-indicator');
                if (data.isDropEnabled) {
                    dropIndicator.innerText = "DROP: ON (ENABLED)"; dropIndicator.className = "drop-status";
                } else {
                    dropIndicator.innerText = "DROP: OFF (DISABLED)"; dropIndicator.className = "drop-status off";
                }
            } catch (error) {
                document.getElementById('status').innerText = "SYS: ERROR 🔴";
            } finally {
                setTimeout(fetchData, 1000); 
            }
        }

        function updateUIAndCheckDrops(data) {
            data.missions.forEach((m, index) => {
                const uniqueKey = m.name || `mission_${index}`;
                
                if (m.cleared && m.dropItem && data.isDropEnabled) {
                    // 最初の読み込み時は「落下済み」として記録するだけで、落とさない
                    if (isFirstLoad) {
                        droppedMissions.add(uniqueKey);
                    } 
                    // 2回目以降の通信で、新しく条件を満たしたものだけを落とす
                    else if (!droppedMissions.has(uniqueKey)) {
                        window.dropItem(m.hintImage || ""); 
                        droppedMissions.add(uniqueKey); 
                    }
                } else {
                    // どれか1つでも条件が外れたら、落下済みリストから消去（もう一度チェックを入れたら落ちる）
                    droppedMissions.delete(uniqueKey);
                }
            });
            // 最初の1周目のチェックが終わったら、フラグを折る
            isFirstLoad = false;
        }

        fetchData();
    </script>
</body>
</html>
