<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POISUTE 2 - TRASH CAM MONITOR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #fff; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; box-sizing: border-box; padding: 20px; z-index: 10; }
        .cam-title { position: absolute; top: 20px; left: 30px; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        .rec-icon { color: red; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        
        #live-monitor {
            position: absolute; top: 70px; left: 30px; font-size: 14px; color: rgba(255,255,255,0.9);
            background: rgba(0,0,0,0.6); padding: 15px; border-radius: 8px; line-height: 1.8;
            max-height: 70vh; overflow: hidden;
        }
        
        #footer-info { position: absolute; bottom: 20px; right: 30px; font-size: 16px; color: #888; text-align: right; line-height: 1.5; }
        .drop-status { font-weight: bold; color: #ffeb3b; }
        .debug-text { font-size: 14px; color: #00e676; margin-top: 5px; font-weight:bold; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <div class="cam-title"><span class="rec-icon">● REC</span> CAM-01 : MAIN TRASH AREA</div>
        <div id="live-monitor">通信を待機中...</div>
        <div id="footer-info">
            <div id="status">SYS: STANDBY...</div>
            <div id="monitor-log" class="debug-text">システム正常起動。Tキーでテスト落下</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505); 
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 14, 22); 
        camera.lookAt(0, -2, 0);       

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0); 
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 3.0); 
        directionalLight.position.set(5, 15, 10);
        directionalLight.castShadow = true; 
        scene.add(directionalLight);

        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');

        const fallingItems = [];
        // 厚み（0.2）を持たせたパネル
        const panelGeometry = new THREE.BoxGeometry(4.0, 4.0, 0.2); 

        window.dropItem = function(imageName) {
            try {
                let randomX, randomZ, landY;
                let attempts = 0, isOverlapping = true;
                
                // 【重ならないための計算】すでに落ちているパネルから「4.0」以上の距離を必ず取る
                while (isOverlapping && attempts < 500) {
                    randomX = (Math.random() - 0.5) * 26; // 横に散らす
                    landY = (Math.random() - 0.5) * 12;   // 上下に散らす
                    randomZ = (Math.random() * -5) - 1;   // 前後に散らしてめり込み防止
                    
                    isOverlapping = false;
                    for (const item of fallingItems) {
                        const dx = item.landX - randomX;
                        const dy = item.landY - landY;
                        // 距離が近すぎたらやり直し（重なり防止）
                        if (Math.sqrt(dx * dx + dy * dy) < 4.0) { 
                            isOverlapping = true; break; 
                        } 
                    }
                    attempts++;
                }

                let material;
                const sideMaterial = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 });

                if (imageName && String(imageName).trim() !== "") {
                    let url = String(imageName).trim();
                    if (!url.startsWith('http')) {
                        url = 'https://riworksnazo.github.io/poisute2-camera/' + url;
                    }
                    const texture = textureLoader.load(url);
                    texture.colorSpace = THREE.SRGBColorSpace;
                    
                    const faceMaterial = new THREE.MeshStandardMaterial({ map: texture, color: 0xffffff, roughness: 0.8, transparent: true });
                    material = [sideMaterial, sideMaterial, sideMaterial, sideMaterial, faceMaterial, faceMaterial];
                } else {
                    material = sideMaterial; 
                }
                
                const item = new THREE.Mesh(panelGeometry, material);
                item.position.set(randomX, 25, randomZ); // 画面の外（上）からスタート
                item.quaternion.copy(camera.quaternion); // 常に真正面を向く
                item.castShadow = true; 
                scene.add(item);

                // landX, landY, landZ をしっかり記憶させる（これがないと重なり防止が効きません！）
                fallingItems.push({ mesh: item, velocity: 0, landX: randomX, landY: landY, landZ: randomZ });
            } catch (err) {
                console.error("落下エラー:", err);
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') location.reload(); 
            if (e.key === 't' || e.key === 'T') window.dropItem(""); 
        });

        function animate() {
            requestAnimationFrame(animate);
            fallingItems.forEach(item => {
                if (item.mesh.position.y > item.landY) {
                    item.velocity += 0.02; // スーッと落ちる
                    item.mesh.position.y -= item.velocity;
                } else {
                    item.mesh.position.y = item.landY; // 着地位置でピタッと止まる
                }
            });
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 賢徳さんのGAS URL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwL6vY1pA1vqbrq4bCLIVLdWGtKoXztcbxsi812AkzILF3eo54oJnh-fw2MCFttjUoh/exec";
        
        let isFetching = false;
        let knownMissions = {}; 
        let isFirstLoad = true;

        async function fetchData() {
            if (isFetching) return; 
            isFetching = true;
            try {
                const response = await fetch(GAS_URL + "?t=" + Date.now(), { cache: 'no-store' });
                const data = await response.json();
                updateUIAndCheckDrops(data);
                document.getElementById('status').innerText = "SYS: ONLINE 🟢";
            } catch (error) {
                document.getElementById('status').innerText = "SYS: ERROR 🔴";
            } finally {
                setTimeout(fetchData, 1000); 
            }
        }

        function updateUIAndCheckDrops(data) {
            let monitorHTML = "<b>▼ リアルタイム通信モニター ▼</b><br>";
            let logText = "";

            data.missions.forEach((m, index) => {
                try {
                    // エラー対策：ミッション名が数字や空欄でも絶対にフリーズさせない
                    const name = String(m.name || `mission_${index}`);
                    const isCleared = (m.cleared === true || String(m.cleared).toUpperCase() === "TRUE");

                    let statusText = isCleared ? '<span style="color:#00e676; font-weight:bold;">ON </span>' : '<span style="color:#ff5252;">OFF</span>';
                    monitorHTML += `[D列: ${statusText}] ${name.substring(0,10)}...<br>`;
                    
                    // 「今はON」かつ「前回はOFFだった」なら落とす！
                    if (isCleared && !knownMissions[name]) {
                        if (!isFirstLoad) {
                            window.dropItem(m.hintImage || ""); 
                            logText = "落下実行: " + name;
                        }
                    }
                    knownMissions[name] = isCleared;
                } catch (err) {
                    console.error("ミッション処理エラー:", err);
                }
            });
            
            document.getElementById('live-monitor').innerHTML = monitorHTML;
            if (logText) document.getElementById('monitor-log').innerText = logText;
            
            isFirstLoad = false;
        }

        fetchData();
    </script>
</body>
</html>
