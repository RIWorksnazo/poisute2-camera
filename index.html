<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POISUTE 2 - TRASH CAM MONITOR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #fff; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; box-sizing: border-box; padding: 20px; z-index: 10; }
        #ui-layer::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%), linear-gradient(90deg, rgba(255,0,0,0.06), rgba(0,255,0,0.02), rgba(0,0,255,0.06));
            z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }
        .cam-title { position: absolute; top: 20px; left: 30px; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        .rec-icon { color: red; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        #footer-info { position: absolute; bottom: 20px; right: 30px; font-size: 16px; color: #888; text-align: right; line-height: 1.5; }
        .drop-status { font-weight: bold; color: #ffeb3b; }
        .drop-status.off { color: #f44336; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <div class="cam-title"><span class="rec-icon">● REC</span> CAM-01 : MAIN TRASH AREA</div>
        <div id="footer-info">
            <div id="status">SYS: STANDBY...</div>
            <div id="drop-indicator" class="drop-status">DROP: CHECKING...</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') {
                location.reload(); 
            }
        });

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505); 
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 8, 15); 
        camera.lookAt(0, 0, 0);       

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0);
        directionalLight.position.set(0, 10, 10);
        scene.add(directionalLight);

        const textureLoader = new THREE.TextureLoader();

        const gltfLoader = new GLTFLoader();
        gltfLoader.load('GarbageCan.glb', (gltf) => {
            const giantTrash = gltf.scene;
            giantTrash.scale.set(8.0, 8.0, 8.0);
            giantTrash.position.set(0, -3, 0);   
            scene.add(giantTrash);
        });

        const fallingItems = [];

        function dropItem(imageName) {
            let randomX, randomZ, landY;
            let attempts = 0;
            let isOverlapping = true;

            while (isOverlapping && attempts < 50) {
                randomX = (Math.random() - 0.5) * 8; 
                randomZ = (Math.random() - 0.5) * 3; 
                landY = (Math.random() * 1.5) - 0.5; 

                isOverlapping = false;
                for (const item of fallingItems) {
                    const dx = item.landX - randomX;
                    const dz = item.landZ - randomZ;
                    const distance = Math.sqrt(dx * dx + dz * dz);
                    if (distance < 1.8) {
                        isOverlapping = true;
                        break;
                    }
                }
                attempts++;
            }

            let material;
            if (imageName && imageName.trim() !== "") {
                const itemTexture = textureLoader.load(imageName); 
                material = new THREE.SpriteMaterial({ map: itemTexture, transparent: true });
            } else {
                material = new THREE.SpriteMaterial({ color: 0xffffff });
            }
            
            const item = new THREE.Sprite(material);
            item.scale.set(2.0, 2.0, 2.0); 
            item.position.set(randomX, 12, randomZ); 
            scene.add(item);

            fallingItems.push({ mesh: item, velocity: 0, bounces: 0, landY: landY, landX: randomX, landZ: randomZ });
        }

        function animate() {
            requestAnimationFrame(animate);
            fallingItems.forEach(item => {
                if (item.mesh.position.y > item.landY) {
                    item.velocity += 0.008; 
                    item.mesh.position.y -= item.velocity;
                } else if (item.bounces < 2) {
                    item.mesh.position.y = item.landY;
                    item.velocity = -item.velocity * 0.3; 
                    item.bounces++;
                }
            });
            renderer.render(scene, camera);
        }
        animate();

        const GAS_URL = "https://script.google.com/macros/s/AKfycbwL6vY1pA1vqbrq4bCLIVLdWGtKoXztcbxsi812AkzILF3eo54oJnh-fw2MCFttjUoh/exec";
        
        let isFetching = false;
        let previousClearedState = []; 

        async function fetchData() {
            if (isFetching) return; 
            isFetching = true;
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                updateUIAndCheckDrops(data);
                document.getElementById('status').innerText = "SYS: ONLINE 🟢";
                
                const dropIndicator = document.getElementById('drop-indicator');
                if (data.isDropEnabled) {
                    dropIndicator.innerText = "DROP: ON (ENABLED)";
                    dropIndicator.className = "drop-status";
                } else {
                    dropIndicator.innerText = "DROP: OFF (DISABLED)";
                    dropIndicator.className = "drop-status off";
                }
            } catch (error) {
                document.getElementById('status').innerText = "SYS: ERROR 🔴";
            } finally {
                isFetching = false;
                setTimeout(fetchData, 2000); 
            }
        }

        function updateUIAndCheckDrops(data) {
            const currentClearedState = [];
            
            data.missions.forEach((m, index) => {
                currentClearedState[index] = m.cleared;
                
                // ▼ 条件追加：「クリアされた瞬間」かつ「全体スイッチON」かつ「個別スイッチ(m.dropItem)もON」の時だけ落とす
                if (m.cleared && previousClearedState[index] === false) {
                    if (data.isDropEnabled && m.dropItem) {
                        dropItem(m.hintImage); 
                    }
                }
            });
            previousClearedState = currentClearedState;
        }

        fetchData();
    </script>
</body>
</html>
