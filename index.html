<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POISUTE 2 - TRASH CAM MONITOR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #fff; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; box-sizing: border-box; padding: 20px; z-index: 10; }
        .cam-title { position: absolute; top: 20px; left: 30px; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 0 #000; }
        .rec-icon { color: red; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
        #footer-info { position: absolute; bottom: 20px; right: 30px; font-size: 16px; color: #888; text-align: right; line-height: 1.5; }
        .drop-status { font-weight: bold; color: #ffeb3b; }
        .drop-status.off { color: #f44336; }
        .debug-text { font-size: 14px; color: #00ff00; margin-top: 5px; font-weight: bold; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <div class="cam-title"><span class="rec-icon">● REC</span> CAM-01 : MAIN TRASH AREA</div>
        <div id="footer-info">
            <div id="status">SYS: STANDBY...</div>
            <div id="drop-indicator" class="drop-status">DROP: CHECKING...</div>
            <div id="debug-text" class="debug-text">Tキーでテスト落下</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505); 
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 8, 15); 
        camera.lookAt(0, 0, 0);       

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 2.0); 
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 3.0); 
        directionalLight.position.set(5, 15, 10);
        directionalLight.castShadow = true; 
        scene.add(directionalLight);

        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');

        const gltfLoader = new GLTFLoader();
        gltfLoader.load('GarbageCan.glb', (gltf) => {
            const giantTrash = gltf.scene;
            giantTrash.scale.set(8.0, 8.0, 8.0);
            giantTrash.position.set(0, -3, 0);
            giantTrash.traverse((child) => {
                if (child.isMesh) {
                    child.receiveShadow = true;
                    child.castShadow = true;
                }
            });
            scene.add(giantTrash);
        });

        const fallingItems = [];
        const boxGeometry = new THREE.BoxGeometry(1.5, 1.5, 1.5);

        window.dropItem = function(imageName) {
            let randomX, randomZ, landY;
            let attempts = 0;
            let isOverlapping = true;

            while (isOverlapping && attempts < 50) {
                // ▼ 変更：画面からはみ出さないちょうど良い広がり方に調整
                randomX = (Math.random() - 0.5) * 14; // 横幅を縮小
                randomZ = (Math.random() - 0.5) * 5;  // 奥行きを縮小
                landY = (Math.random() * 1.5) - 0.5; 

                isOverlapping = false;
                for (const item of fallingItems) {
                    const dx = item.landX - randomX;
                    const dz = item.landZ - randomZ;
                    const distance = Math.sqrt(dx * dx + dz * dz);
                    if (distance < 1.8) {
                        isOverlapping = true;
                        break;
                    }
                }
                attempts++;
            }

            let material;
            if (imageName && imageName.trim() !== "") {
                const itemTexture = textureLoader.load(imageName); 
                material = new THREE.MeshStandardMaterial({ 
                    map: itemTexture, 
                    roughness: 0.7, 
                    metalness: 0.1 
                });
            } else {
                material = new THREE.MeshStandardMaterial({ color: 0xffffff });
            }
            
            const item = new THREE.Mesh(boxGeometry, material);
            item.position.set(randomX, 12, randomZ); 
            item.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
            item.castShadow = true; 
            scene.add(item);

            fallingItems.push({ 
                mesh: item, 
                velocity: 0, 
                bounces: 0, 
                landY: landY, 
                landX: randomX, 
                landZ: randomZ,
                rotSpeedX: (Math.random() - 0.5) * 0.2,
                rotSpeedY: (Math.random() - 0.5) * 0.2,
                rotSpeedZ: (Math.random() - 0.5) * 0.2
            });
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'r' || e.key === 'R') location.reload(); 
            if (e.key === 't' || e.key === 'T') window.dropItem(""); 
        });

        function animate() {
            requestAnimationFrame(animate);
            fallingItems.forEach(item => {
                if (item.mesh.position.y > item.landY) {
                    item.velocity += 0.008; 
                    item.mesh.position.y -= item.velocity;
                    item.mesh.rotation.x += item.rotSpeedX;
                    item.mesh.rotation.y += item.rotSpeedY;
                    item.mesh.rotation.z += item.rotSpeedZ;
                } else if (item.bounces < 2) {
                    item.mesh.position.y = item.landY;
                    item.velocity = -item.velocity * 0.3; 
                    item.bounces++;
                    item.rotSpeedX *= 0.5;
                    item.rotSpeedY *= 0.5;
                }
            });
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const GAS_URL = "https://script.google.com/macros/s/AKfycbwL6vY1pA1vqbrq4bCLIVLdWGtKoXztcbxsi812AkzILF3eo54oJnh-fw2MCFttjUoh/exec";
        
        let isFetching = false;
        let previousClearedState = []; 

        async function fetchData() {
            if (isFetching) return; 
            isFetching = true;
            try {
                const response = await fetch(GAS_URL);
                const data = await response.json();
                updateUIAndCheckDrops(data);
                document.getElementById('status').innerText = "SYS: ONLINE 🟢";
                
                const dropIndicator = document.getElementById('drop-indicator');
                if (data.isDropEnabled) {
                    dropIndicator.innerText = "DROP: ON (ENABLED)";
                    dropIndicator.className = "drop-status";
                } else {
                    dropIndicator.innerText = "DROP: OFF (DISABLED)";
                    dropIndicator.className = "drop-status off";
                }
            } catch (error) {
                document.getElementById('status').innerText = "SYS: ERROR 🔴";
            } finally {
                setTimeout(fetchData, 1000); 
            }
        }

        function updateUIAndCheckDrops(data) {
            const currentClearedState = [];
            let isOColumnRecognized = false;
            
            data.missions.forEach((m, index) => {
                currentClearedState[index] = m.cleared;
                
                if (m.dropItem === true) {
                    isOColumnRecognized = true;
                }
                
                if (m.cleared && previousClearedState[index] === false) {
                    if (data.isDropEnabled && m.dropItem) {
                        window.dropItem(m.hintImage); 
                    }
                }
            });
            previousClearedState = currentClearedState;
            
            const debugText = document.getElementById('debug-text');
            if (isOColumnRecognized) {
                debugText.innerText = "【通信OK】O列のチェック認識中 / Tキーでテスト落下";
                debugText.style.color = "#00ff00";
            } else {
                debugText.innerText = "【警告】O列のチェックが1つも認識されていません！";
                debugText.style.color = "#ff5252";
            }
        }

        fetchData();
    </script>
</body>
</html>
