<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POISUTE 2 - TRASH CAM MONITOR</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #fff; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; box-sizing: border-box; padding: 20px; z-index: 10; }
        
        .cam-title { position: absolute; top: 20px; left: 30px; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        .live-icon { color: red; animation: slowBlink 2s infinite ease-in-out; }
        @keyframes slowBlink { 
            0% { opacity: 1; } 
            50% { opacity: 0.2; } 
            100% { opacity: 1; } 
        }
        
        #footer-info { position: absolute; bottom: 20px; right: 30px; font-size: 16px; text-align: right; line-height: 1.5; text-shadow: 1px 1px 3px #000; opacity: 0.5; }
        .debug-text { font-size: 12px; color: #00e676; margin-top: 5px; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="ui-layer">
        <div class="cam-title"><span class="live-icon">● LIVE</span></div>
        <div id="footer-info">
            <div id="status">SYS: STANDBY</div>
            <div id="monitor-log" class="debug-text">SPACE: RETRY / C: CLEAR</div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111); 
        
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 18, 42); 
        camera.lookAt(0, -5, 0);       

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = false; 
        container.appendChild(renderer.domElement);

        const boxGeometry = new THREE.BoxGeometry(80, 50, 65);
        const boxMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xcccccc,       
            side: THREE.BackSide,  
            roughness: 0.9 
        });
        const bigBox = new THREE.Mesh(boxGeometry, boxMaterial);
        bigBox.position.set(0, 10, 0); 
        scene.add(bigBox);

        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5); 
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 2.0); 
        directionalLight.position.set(0, 25, 20); 
        scene.add(directionalLight);

        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');

        const fallingItems = [];
        const panelGeometry = new THREE.PlaneGeometry(32.0, 18.0); 

        // ==========================================
        // 🌟 特殊演出の設定エリア 🌟
        // ==========================================
        const TARGET_DROP_FILE = "special_drop.png"; 
        const TARGET_DROP_X = 10.0;   
        const TARGET_DROP_Z = -5.0;  

        const TARGET_APPEAR_FILE = "special_appear.mp4"; 
        const TARGET_APPEAR_X = -10.0; 
        const TARGET_APPEAR_Z = -15.0;  
        // ==========================================

        window.dropItem = function(imageName) {
            try {
                let posX, posZ, landY;
                let attempts = 0, isOverlapping = true;
                
                let isTargetDrop = false;
                let isTargetAppear = false;

                if (imageName && String(imageName).trim() !== "") {
                    let checkName = String(imageName);
                    if (TARGET_DROP_FILE !== "" && checkName.includes(TARGET_DROP_FILE)) {
                        isTargetDrop = true;
                    } else if (TARGET_APPEAR_FILE !== "" && checkName.includes(TARGET_APPEAR_FILE)) {
                        isTargetAppear = true;
                    }
                }

                if (isTargetDrop || isTargetAppear) {
                    posX = isTargetDrop ? TARGET_DROP_X : TARGET_APPEAR_X;
                    posZ = isTargetDrop ? TARGET_DROP_Z : TARGET_APPEAR_Z;
                    landY = -5.0 + (fallingItems.length * 0.05); 
                } else {
                    // ※フリーズ防止のため、attemptsを500→50に減らしました
                    while (isOverlapping && attempts < 50) {
                        posX = (Math.random() - 0.5) * 35; 
                        posZ = (Math.random() * -30) + 5; 
                        landY = -6.0 + (fallingItems.length * 0.05); 
                        
                        isOverlapping = false;
                        for (const item of fallingItems) {
                            const dx = item.landX - posX;
                            const dz = item.landZ - posZ;
                            if (Math.sqrt(dx * dx + dz * dz) < 20.0) { 
                                isOverlapping = true; break; 
                            } 
                        }
                        attempts++;
                    }
                }

                let material;

                if (imageName && String(imageName).trim() !== "") {
                    let url = String(imageName).trim();
                    if (!url.startsWith('http')) {
                        url = 'https://riworksnazo.github.io/poisute2-camera/' + url;
                    }
                    
                    let texture;
                    if (url.toLowerCase().endsWith('.mp4')) {
                        const video = document.createElement('video');
                        video.src = url;
                        video.crossOrigin = 'anonymous';
                        video.loop = true;  
                        video.muted = true; 
                        video.playsInline = true;
                        video.play();
                        
                        texture = new THREE.VideoTexture(video);
                        texture.colorSpace = THREE.SRGBColorSpace;
                    } else {
                        texture = textureLoader.load(url);
                        texture.colorSpace = THREE.SRGBColorSpace;
                    }
                    
                    material = new THREE.MeshBasicMaterial({ 
                        map: texture, 
                        transparent: true,
                        side: THREE.DoubleSide
                    });
                } else {
                    material = new THREE.MeshBasicMaterial({ 
                        color: 0xffffff, 
                        side: THREE.DoubleSide
                    }); 
                }
                
                const item = new THREE.Mesh(panelGeometry, material);
                
                if (isTargetAppear) {
                    item.position.set(posX, landY, posZ); 
                } else {
                    item.position.set(posX, 35, posZ);    
                }
                
                item.quaternion.copy(camera.quaternion); 
                scene.add(item);

                fallingItems.push({ mesh: item, velocity: 0, landX: posX, landY: landY, landZ: posZ });
            } catch (err) {
                console.error("落下エラー:", err);
            }
        }

        // ==========================================
        // ⌨️ 本番用キーボード操作
        // ==========================================
        window.addEventListener('keydown', (e) => {
            // 【R】更新（復元）：ブラウザの更新と同じ。スプシにチェック済みのものは全て降ってきます
            if (e.key === 'r' || e.key === 'R') location.reload(); 
            
            // 【T】テスト落下：白いパネルを1枚落とします
            if (e.key === 't' || e.key === 'T') window.dropItem(""); 
            
            // 【C】完全リセット：公演ごとのリセット用。画面のアイテムを全部消します。
            if (e.key === 'c' || e.key === 'C') {
                fallingItems.forEach(item => scene.remove(item.mesh));
                fallingItems.length = 0;
                knownMissions = {}; // 記憶もリセット
                document.getElementById('monitor-log').innerText = "SCREEN CLEARED";
            }
            
            // 【Space】手動再接続：エラーになった時、画面を消さずに通信だけ再開します
            if (e.key === ' ') {
                if (!isFetching) {
                    document.getElementById('status').innerText = "SYS: RETRYING...";
                    document.getElementById('status').style.color = "#ffeb3b";
                    fetchData();
                }
            }
        });

        function animate() {
            requestAnimationFrame(animate);
            fallingItems.forEach(item => {
                if (item.mesh.position.y > item.landY) {
                    item.velocity += 0.05; 
                    item.mesh.position.y -= item.velocity;
                } else {
                    item.mesh.position.y = item.landY; 
                }
            });
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const GAS_URL = "https://script.google.com/macros/s/AKfycbwL6vY1pA1vqbrq4bCLIVLdWGtKoXztcbxsi812AkzILF3eo54oJnh-fw2MCFttjUoh/exec";
        let isFetching = false;
        let knownMissions = {}; 
        let isFirstLoad = true;

        async function fetchData() {
            if (isFetching) return; 
            isFetching = true;
            try {
                const response = await fetch(GAS_URL + "?t=" + Date.now(), { cache: 'no-store' });
                const data = await response.json();
                updateUIAndCheckDrops(data);
                document.getElementById('status').innerText = "SYS: ONLINE";
                document.getElementById('status').style.color = "#888";
            } catch (error) {
                // エラー時は赤文字で表示。スペースキーで復帰可能。
                document.getElementById('status').innerText = "SYS: ERROR (Press SPACE to retry)";
                document.getElementById('status').style.color = "#ff5252";
            } finally {
                isFetching = false; 
                // ▼ Googleに怒られないよう、2秒（2000）間隔に変更しました
                setTimeout(fetchData, 2000); 
            }
        }

        function updateUIAndCheckDrops(data) {
            let logText = "";

            data.missions.forEach((m, index) => {
                try {
                    const name = String(m.name || m.hintImage || `mission_${index}`);
                    const isCleared = (m.cleared === true || String(m.cleared).toUpperCase() === "TRUE");

                    // ▼ 修正！ロード時（更新時）にも、チェック済みのものは全てドロップさせます（消えない更新）
                    if (isCleared && !knownMissions[name]) {
                        window.dropItem(m.hintImage || ""); 
                        if (!isFirstLoad) {
                            logText = "DROP: " + String(m.name || "ITEM").substring(0,6);
                        }
                    }
                    knownMissions[name] = isCleared;
                } catch (err) {
                }
            });
            
            if (logText) {
                const logEl = document.getElementById('monitor-log');
                logEl.innerText = logText;
                logEl.style.color = "#fff";
                setTimeout(() => { logEl.style.color = "#00e676"; }, 500);
            }
            
            isFirstLoad = false;
        }

        fetchData();
    </script>
</body>
</html>
